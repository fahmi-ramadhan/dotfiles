# overrides the default color
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Set the prefix key to Ctrl + a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Use vim-style pane switching
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Enable mouse support
set -g mouse on

# Set colors to match Tokyonight theme
set -g status-style bg=#1a1b26,fg=#c0caf5
set -g status-left "#[fg=#7aa2f7,bg=#1a1b26]  #[fg=#c0caf5,bg=#1a1b26] #S "
set -g status-right "#[fg=#bb9af7,bg=#1a1b26] %Y-%m-%d #[fg=#7dcfff,bg=#1a1b26] %H:%M"

# Active window style
setw -g window-status-current-format "#[fg=#7aa2f7,bg=#1a1b26] #I:#W "
setw -g window-status-format "#[fg=#565f89,bg=#1a1b26] #I:#W "

# Pane border styling
set -g pane-border-style fg=#414868
set -g pane-active-border-style fg=#7aa2f7

# Command prompt styling
set -g message-style fg=#c0caf5,bg=#1a1b26
set -g message-command-style fg=#c0caf5,bg=#1a1b26
